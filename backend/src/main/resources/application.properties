spring.application.name=gpg-union-portal

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/union_portal?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Qu@ngminh80}

# Persistence
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.flyway.enabled=true

# HTTP and JSON
spring.jackson.time-zone=Asia/Bangkok
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.port=${SERVER_PORT:3638}

# Actuator
management.endpoints.web.exposure.include=health,info

# Application
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3637}
app.auth.issuer=gpg-union-portal
app.auth.jwt-secret=${JWT_SECRET:local-dev-only-change-this-jwt-secret-2026-gpg-union-portal}
app.auth.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:480}
app.auth.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Bootstrap accounts
app.auth.bootstrap-admin.username=${ADMIN_USERNAME:admin}
app.auth.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@123!}
app.auth.bootstrap-admin.full-name=${ADMIN_FULL_NAME:Quản trị viên GPG}
app.auth.bootstrap-user.username=${USER_USERNAME:user.vcs}
app.auth.bootstrap-user.password=${USER_PASSWORD:User@123!}
app.auth.bootstrap-user.full-name=${USER_FULL_NAME:Cán bộ CĐCS VCS}
app.auth.bootstrap-user.unit-code=${USER_UNIT_CODE:VCS}
