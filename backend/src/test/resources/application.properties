spring.datasource.url=jdbc:h2:mem:union_portal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

logging.level.root=ERROR

app.cors.allowed-origin=http://localhost:3637
app.auth.issuer=gpg-union-portal-test
app.auth.jwt-secret=test-only-jwt-secret-with-at-least-32-bytes-2026
app.auth.access-token-minutes=30
app.auth.bcrypt-strength=4
app.auth.bootstrap-admin.username=admin
app.auth.bootstrap-admin.password=Admin@123!
app.auth.bootstrap-admin.full-name=Quản trị viên kiểm thử
app.auth.bootstrap-user.username=user.vcs
app.auth.bootstrap-user.password=User@123!
app.auth.bootstrap-user.full-name=Người dùng VCS kiểm thử
app.auth.bootstrap-user.unit-code=VCS
