# Chạy toàn bộ chuỗi Flyway và test tích hợp trên MySQL thật thay vì H2 ở chế độ MODE=MySQL.
#
# Vì sao cần: application.properties của test ghim H2, còn production chạy MySQL 8.4.
# V16__add_activity_program_reports.sql dùng block DELIMITER của MySQL mà H2 không thực thi đúng,
# nên một mình H2 không chứng minh được là các migration áp được lên production.
#
# Bật bằng biến môi trường SPRING_PROFILES_ACTIVE=mysql (CI đặt sẵn), không phải bằng -D:
# surefire fork JVM riêng và không tự chuyển tiếp system property của Maven.
#
# Lưu ý khi chạy tại máy: schema MySQL không tự làm mới giữa các lần chạy như H2 in-memory.
# Hãy dùng một database dùng riêng cho test và xóa/tạo lại trước mỗi lần chạy.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/union_portal_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
